<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<title>刘雨昕 · 十九岁</title>
<style>
  :root{
    --bg:#0b0f16;
    --bg-soft:#101724;
    --bg-card:#121a28;
    --text:#eef1f5;
    --muted:#8d97a6;
    --faint:#5a6472;
    --line:rgba(255,255,255,.09);
    --line-soft:rgba(255,255,255,.16);
    --accent:#7aa7d6;
    --warm:#dfae5e;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,"Times New Roman",serif;
    --sans:"Helvetica Neue","Segoe UI",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:rgba(122,167,214,.32);color:#fff}

  /* ---------- 入场（克制：仅位移+淡入，无模糊） ---------- */
  .fade{
    opacity:0;transform:translateY(22px);
    transition:opacity .9s var(--ease),transform .9s var(--ease);
    transition-delay:var(--d,0ms);
  }
  .fade.in{opacity:1;transform:none}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;
    padding:26px clamp(22px,4vw,56px);
    font-size:12px;letter-spacing:.18em;color:var(--faint);
    text-transform:uppercase;
  }
  .topbar b{color:var(--muted);font-weight:600}
  .topbar span:last-child{letter-spacing:.24em}

  .wrap{max-width:1160px;margin:0 auto;padding:0 clamp(22px,4vw,56px)}

  .kicker{
    font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--faint);font-weight:500;
  }

  /* ---------- Hero ---------- */
  .hero{
    min-height:100vh;
    display:grid;grid-template-columns:1fr 1fr;
    align-items:center;gap:clamp(28px,5vw,72px);
    padding-top:110px;padding-bottom:60px;
  }
  .hero-text .title{
    margin-top:26px;
    font-size:clamp(72px,10vw,150px);
    font-weight:700;line-height:.96;letter-spacing:-.02em;
    color:var(--text);
  }
  .hero-text .name{
    margin-top:18px;font-size:clamp(26px,3.4vw,44px);
    font-weight:600;letter-spacing:.12em;color:var(--muted);
  }
  .hero-text .sub{
    margin-top:30px;font-size:clamp(15px,1.7vw,18px);
    color:var(--muted);
  }
  .hero-text .rule{
    margin-top:40px;width:56px;height:1px;background:var(--line-soft);
  }

  .hero-media{
    position:relative;overflow:hidden;
    border:1px solid var(--line);
    aspect-ratio:4/5;max-height:78vh;justify-self:stretch;
  }
  .hero-media img{
    width:100%;height:100%;object-fit:cover;object-position:center 22%;
    display:block;filter:saturate(.88) contrast(1.05) brightness(1.01);
    transform:scale(1.05);
    transition:transform 1.8s var(--ease);
  }
  .hero-media.in img{transform:scale(1)}
  /* 左缘淡入背景，融入文字区 */
  .hero-media::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,var(--bg) 0%,rgba(11,15,22,.55) 22%,transparent 46%);
  }

  /* ---------- 章节通用 ---------- */
  section{padding:clamp(80px,12vh,140px) 0}
  .sec-head{margin-bottom:clamp(36px,6vh,60px)}
  .sec-head h2{
    margin-top:14px;font-size:clamp(28px,4vw,46px);
    font-weight:700;letter-spacing:.01em;color:var(--text);
  }

  /* ---------- 寄语 ---------- */
  .note{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .note p{
    max-width:22em;font-size:clamp(22px,3.2vw,34px);
    line-height:1.75;font-weight:400;color:var(--text);
  }
  .note p em{font-style:normal;color:var(--muted)}

  /* ---------- 三卡（几何、细边、无玻璃） ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,22px)}
  .card{
    border:1px solid var(--line);
    background:var(--bg-card);
    padding:clamp(24px,3vw,34px);
    transition:border-color .4s var(--ease);
  }
  .card:hover{border-color:var(--line-soft)}
  .card .idx{font-size:12px;letter-spacing:.24em;color:var(--faint);font-weight:500}
  .card h3{margin-top:22px;font-size:clamp(20px,2.2vw,26px);font-weight:700;color:var(--text)}
  .card p{margin-top:12px;font-size:14px;line-height:1.8;color:var(--muted)}

  /* ---------- 蛋糕 ---------- */
  .cake{text-align:center}
  .cake .kicker{letter-spacing:.3em}
  .cake h2{margin-top:14px;font-size:clamp(30px,4.2vw,48px);font-weight:700}
  .cake-stage{
    position:relative;display:inline-block;
    width:min(78vw,340px);margin-top:36px;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .cake-stage svg{width:100%;height:auto;display:block;overflow:visible}
  .flame{transition:opacity .5s var(--ease)}
  .cake-stage.blown .flame{opacity:0}
  .cake-hint{margin-top:26px;font-size:12px;letter-spacing:.24em;color:var(--faint)}
  .cake-wish{
    margin-top:30px;font-size:clamp(16px,2vw,19px);color:var(--muted);
    opacity:0;transform:translateY(10px);
    transition:opacity .9s var(--ease),transform .9s var(--ease);
  }
  .cake-wish.show{opacity:1;transform:none}
  .cake-wish b{color:var(--text);font-weight:600}

  /* ---------- 收尾 ---------- */
  .closing{border-top:1px solid var(--line);text-align:center}
  .closing h2{font-size:clamp(30px,5.4vw,60px);font-weight:700;letter-spacing:.04em;color:var(--text)}
  .closing .sub{margin-top:18px;color:var(--muted);font-size:clamp(14px,1.6vw,16px)}

  footer{
    padding:50px 0 60px;text-align:center;
    font-size:11px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;
  }
  .sign{
    margin-top:18px;
    font-family:var(--serif);font-size:14px;
    letter-spacing:.08em;text-transform:none;color:var(--faint);
  }

  /* ---------- 编辑体：衬线 + 字母索引 ---------- */
  .mono{font-family:var(--serif);font-weight:600;letter-spacing:0;color:var(--accent)}

  .sec-letter{
    font-family:var(--serif);
    font-size:clamp(26px,3.6vw,42px);
    line-height:1;font-weight:500;letter-spacing:0;
    color:rgba(122,167,214,.34);
    margin-bottom:16px;
  }

  .hero-text .title{font-family:var(--serif);font-weight:600}
  .hero-text .name{font-family:var(--serif);font-weight:400}
  .hero-text .sub{font-family:var(--serif);color:var(--text)}

  .note p{font-family:var(--serif);font-weight:400}
  .note .note-body{margin-top:20px}
  .note .note-body p + p{margin-top:1.25em}

  .sec-head h2{font-family:var(--serif);font-weight:600}
  .card h3{font-family:var(--serif);font-weight:600}
  .cake h2{font-family:var(--serif)}
  .cake-wish{font-family:var(--serif)}
  .closing h2{font-family:var(--serif);font-weight:600}
  .closing .sub{font-family:var(--serif)}

  /* ---------- 响应式 ---------- */
  @media (max-width:860px){
    .hero{grid-template-columns:1fr;gap:40px;padding-top:120px}
    .hero-media{order:-1;aspect-ratio:1/1;max-height:none;justify-self:stretch}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    .fade{opacity:1;transform:none;transition:none}
    .hero-media img{transform:none}
  }
</style>
</head>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var items = document.querySelectorAll('.fade');
  if('IntersectionObserver' in window && !reduce){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    },{threshold:0.16, rootMargin:'0px 0px -6% 0px'});
    items.forEach(function(el){ io.observe(el); });
  } else {
    items.forEach(function(el){ el.classList.add('in'); });
  }
  // 首屏立即
  var heroItems = document.querySelectorAll('.hero .fade, .hero-media');
  if(reduce){ heroItems.forEach(function(el){ el.classList.add('in'); }); }
  else { setTimeout(function(){ heroItems.forEach(function(el){ el.classList.add('in'); }); }, 60); }

  // 吹蜡烛
  var cake = document.getElementById('cakeStage');
  var wish = document.getElementById('cakeWish');
  if(cake){
    function blow(){
      if(cake.classList.contains('blown')) return;
      cake.classList.add('blown');
      if(wish) wish.classList.add('show');
    }
    cake.addEventListener('click', blow);
    cake.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); blow(); }
    });
  }
})();
</script>
